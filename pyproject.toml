[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zenithal-parking"
version = "0.1.0"
description = "Area-based parking occupancy and spot assignment from zenithal cameras (PhD research code)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Juan Manuel Carrera García" }]
license = { text = "MIT" }
dependencies = [
  "numpy==2.2.6",
  "opencv-contrib-python-headless==4.12.0.88",
  "shapely==2.1.2",
  "scikit-learn==1.8.0",
  "scipy==1.16.3",
  "matplotlib==3.10.7",
  "psutil==7.1.3",
]

[project.optional-dependencies]
detection = ["torch==2.9.1", "torchvision==0.24.1", "ultralytics==8.3.235"]
messaging = ["protobuf==6.33.1", "paho-mqtt==2.1.0"]
dev = ["pytest==8.4.2", "ruff==0.14.5", "maturin==1.9.6"]

[tool.setuptools.packages.find]
include = ["mapping*", "detection*", "motion*", "measurement*", "occupancy*", "assignment*", "messaging*", "pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
